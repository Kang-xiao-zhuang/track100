name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: typecheck / unit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 项目没有 ESLint 配置,`next lint` 会进入交互式询问,不适合 CI;以类型检查代替。
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    name: smoke test (core flow)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
